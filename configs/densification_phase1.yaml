# configs/densification_phase1.yaml — run5: 밀도 혼합 증강 phase1 재학습
# 근거: reports/2026-08-05-run5-density-training-instructions.md
#
# configs/lpips_low_phase1.yaml(= run4 as-run 기록, 편집 금지)의 전체 복사본에서
# 아래 세 항목만 바꾼 파일이다. base.yaml에는 model 블록도 batch_size도 없으므로
# "바뀐 키만 적는" 축약본으로 쓰면 batch_size가 기본값 4로 떨어진다 — 전체를 명시한다.
#
# run4 대비 변경점 (지침서 §2-1):
#   ① 학습 데이터: 밀도 혼합 증강 (∞/T21/T15/T12 epoch 라운드로빈)   ← training.densify
#   ② LPIPS 활성: epoch 30% warmup → PixelGen noise gate (Eq.9, tau=0.3 ⟺ sigma <= 0.7)
#   ③ output_dir: run4 체크포인트를 덮어쓰지 않도록 분리
# 그 외 하이퍼파라미터·아키텍처는 run4와 완전히 동일하게 유지한다.
#
# 🔴 run5는 run4 대비 2변수 변경이다. 결과를 밀도 증강 단독 효과로 귀속시키지 말 것.
#    밀도 단독 효과의 근거는 추론 검증(8/4~5, 재학습 없이 입력만 교체)이 제공한다.
base: configs/base.yaml

# 아래 model 블록은 현재 trainer 기본값과 값이 같지만(trainer.py:224-229), run4와의 아키텍처 동일성이
# 이 실험의 전제이므로 기본값에 의존하지 않고 명시한다(32ch = 16 latent + 16 raw anchor).
model:
  zero_matte_cond: false
  zero_matte_feat: false
  zero_raw_matte: false
  num_extra_conditioning_channels: 16
  matte_bias_zero_init: true
  use_matte_scale: true

training:
  phase: pretrain            # edge off, LPIPS timestep gate (edge는 finetune에서만 켜짐)
  dataset: unbraid           # unbraid 3000 → 187 step/epoch (run4와 동일)
  epochs: 40                 # ⚠️ 15로 줄이지 말 것: cosine LR T_max가 이 값에 묶여 있어
                             #    (trainer.py:393-403) 15로 바꾸면 LR 감쇠가 압축돼 run4와의 비교가 깨진다.
                             #    40으로 두고 epoch 15에서 "수동 중단"한다(지침서 §6-2 / §1).
  batch_size: 16             # 누락 금지(기본값 4) — s≈37 전제가 깨짐
  learning_rate: 1.0e-4
  warmup_steps: 500
  mode: forward
  schedule: all
  gate_alpha: 1.0
  resume: null

  loss_weights:
    flow: 1.0
    lpips: 0.002              # run4와 동일. R = 0.1 × (목표 R / 1.016) → 목표 0.02
    edge: 0.0                 # pretrain
    # ② run4의 lpips_warmup_frac: 0.3 을 대체. PixelGen noise gate (논문 Eq.9, tau=0.3).
    #    PixelGen의 t는 데이터 계수(x_t = t*x + (1-t)*eps)라 게이트는 노이즈 계수 (1-t) <= 0.7이고,
    #    우리 sigma가 곧 그 노이즈 계수(noisy = (1-sigma)*x + sigma*noise)다.
    #    shift 재변환 대상이 아니다 — SD3.5의 shift=3.0은 scheduler.sigmas에 이미 반영돼 있고
    #    PixelGen은 timeshift=1.0(항등)으로 학습한다 (지침서 §2-2).
    #    ⚠️ 활성되는 것은 timestep 구간의 하위 70%이지 "샘플의 70%"가 아니다.
    #       HairDiT의 logit-normal+shift=3.0 샘플링에서 실제 활성 샘플은 약 40%.
    lpips_noise_cutoff: 0.7
    scale_sync: true          # 유지 — loss 절대 스케일·grad clip 거동을 run4와 동일하게 두기 위함
    s_min: 20.0
    s_max: 120.0
    # flow matte 가중(m² → m)은 config 키가 아니라 src/training/losses.py의 FlowMatchingLoss에서
    # 직접 수정됨 — run4와 같은 상태이므로 별도 조치 없음.

  # ① 신규: 밀도 혼합 증강 (지침서 §4)
  #    epoch마다 threshold 하나를 확정해 그 epoch의 전 샘플에 동일 적용(샘플별 무작위 아님).
  #    null = ∞(원본 sketch, densification 없음). 라운드로빈 순서: ∞ → T21 → T15 → T12 → 반복.
  #    epoch 15에서 끊으면 ∞/T21/T15 각 4회, T12만 3회이고 최종 epoch의 밀도는 T15다
  #    (= 추론 작동점). 16에서 끊으면 4/4/4/4로 균등해진다 — LR 스케줄과 무관하므로 자유.
  #    ⚠️ 마스크는 scripts/preprocess/densify_shs.py masks 로 사전 생성해야 한다(§5-1).
  densify:
    enabled: true
    mask_root: data/densify_masks
    thresholds: [null, 21, 15, 12]

checkpointing:
  # 🔴 lpips_low_phase1/ 로 두면 서버의 run4 full 체크포인트(epoch_N.pth, 개당 ~20GB, 사본 없음)를
  #    같은 파일명으로 경고 없이 덮어쓴다(trainer.py:154는 mkdir만 하고 존재 검사가 없다).
  #    서버 경로: /lambda/nfs/hairDiT/checkpoints/lpips_low_phase1
  output_dir: checkpoints/densification_phase1/
  eval_every: 10              # flow val (참고용) — run4와 동일
  perceptual_every: 1         # perceptual val 매 epoch — 중단 판단 신호
  save_every: 5               # run4와 같은 저장 격자(5/10/15/20)를 유지해 epoch 매칭 비교가 가능하게 함.
                              # epoch 15 기준 3회 저장 ≈ 78GB (full ~20GB + infer 6.1GB / 회).
                              # ⚠️ 저장 시점의 밀도가 갈린다: ep5=∞ / ep10=T21 / ep15=T15.
                              #    EMA decay 0.9999(유효 지평 ~10k step ≫ 총 2805 step)라 완충이 안 되므로
                              #    최종 가중치는 직전 187 step이 본 밀도(T15)에 치우친다 — 리포트에 명시할 것.

# ⚠️ 판정에 best.pth를 쓰지 말 것.
#   trainer의 phase1 best 선정·조기종료 트리거는 모두 dE_unbraid(색) 기준이다(trainer.py:522-537).
#   방향 정렬 판정은 epoch_N.pth로 해야 한다.

# 착수 직후 필수 확인 (지침서 §2-3 / §8) — 벗어나면 즉시 중단:
#   - step ~10:        lpips_active_fraction ≈ 0.40 ± 0.03   (0.70이 아니다)
#   - step ~10:        densify_t = 0        (epoch 0 = ∞)
#   - step ~100, ~200: R_lpips ∈ [0.015, 0.030]  (run4 실측 0.0178~0.0280)
#                      벗어나면 lpips 값만 재조정해 재시작
#   - 전 구간:         s_raw 28~51, clamp_hi/clamp_lo 0%   (run4 실측 밴드)
#   - 소요: LPIPS가 1 epoch부터 상시 활성이므로 3.16 s/it × 187 step ≈ 10분/epoch
#           → 15 epoch ≈ 2.5h + 매 epoch perceptual val 오버헤드
